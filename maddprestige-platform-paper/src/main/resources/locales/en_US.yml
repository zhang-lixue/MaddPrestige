command.doctor.status: "Doctor: <status>"
command.doctor.finding: "<status> <path> [<code>]"
command.doctor.finding.active_configuration.summary: "<status> <path> [<code>]: this reports whether a canonical V2 configuration revision is active; without one, progression execution is unavailable."
command.doctor.finding.active_configuration.remediation: "Next: if inactive, run setup or validate and apply a draft; otherwise no configuration activation action is required."
command.doctor.finding.provider_health.summary: "<status> <path> [<code>]: the provider's activation and health state determines whether dependent progression behavior is available."
command.doctor.finding.provider_health.remediation: "Next: restore the required dependency or remove its active configuration reference; dormant providers require no action."
command.doctor.finding.database.summary: "<status> <path> [<code>]: SQLite reachability and schema currency determine whether durable state can be read and committed safely."
command.doctor.finding.database.remediation: "Next: restore the configured SQLite database or complete the documented migration and integrity workflow before execution."
command.doctor.finding.rank_targets.summary: "<status> <path> [<code>]: a managed external rank adapter or configured target group could not be verified."
command.doctor.finding.rank_targets.remediation: "Next: restore provider storage/API and ensure every configured group exists outside MaddPrestige, then run Doctor again."
command.doctor.finding.configuration_history.summary: "<status> <path> [<code>]: configuration history contains an interrupted or recently failed application outcome that needs review."
command.doctor.finding.configuration_history.remediation: "Next: compare the active revision pointer with the referenced history entry and reconcile the interrupted or failed attempt."
command.doctor.finding.schema.summary: "<status> <path> [<code>]: the active configuration schema version is being compared with the runtime's required version."
command.doctor.finding.schema.remediation: "Next: if mismatched, migrate and recompile the canonical configuration before enabling execution."
command.doctor.finding.provider_reference.summary: "<status> <path> [<code>]: this canonical path references a metric, cost, or reward capability that must remain active and healthy."
command.doctor.finding.provider_reference.remediation: "Next: restore the exact provider capability or edit <path> to reference one that is active and compatible."
command.doctor.finding.operation_pending.summary: "<status> <path> [<code>]: a durable operation has not reached a final outcome and blind replay could duplicate effects."
command.doctor.finding.operation_pending.remediation: "Next: inspect durable action evidence and follow the documented recovery workflow before retrying."
command.doctor.finding.reconciliation.summary: "<status> <path> [<code>]: an operation or stage transition has unresolved state that blocks conflicting work."
command.doctor.finding.reconciliation.remediation: "Next: reconcile durable internal and external evidence, or allow the active lease to finish, before another conflicting operation."
command.doctor.finding.player_state.summary: "<status> <path> [<code>]: inspected player state references a stage absent from the active configuration."
command.doctor.finding.player_state.remediation: "Next: restore the referenced revision or perform an audited compare-and-set stage migration."
command.doctor.finding.integrity.summary: "<status> <path> [<code>]: immutable-ID or entitlement integrity is inconsistent and deterministic behavior cannot be guaranteed."
command.doctor.finding.integrity.remediation: "Next: correct the duplicate or inconsistent canonical definition and apply a new validated revision."
command.doctor.finding.not_checked.summary: "<status> <path> [<code>]: this diagnostic domain was not checked by the current runtime composition, so broad health must not be inferred."
command.doctor.finding.not_checked.remediation: "Next: connect the domain's diagnostic probe when that subsystem applies, or keep the unsupported capability disabled."
command.doctor.finding.probe_failure.summary: "<status> <path> [<code>]: a read-only diagnostic probe could not complete, so its subsystem health remains unknown."
command.doctor.finding.probe_failure.remediation: "Next: inspect debug logs, restore the affected subsystem, and rerun Doctor."
command.doctor.finding.subsystem.summary: "<status> <path> [<code>]: runtime subsystem <component> reported its current operational health."
command.doctor.finding.subsystem.remediation: "Next: restore blocked or warning subsystems before relying on dependent output; healthy or intentionally disabled subsystems need no action."
command.doctor.finding.general.summary: "<status> <path> [<code>]: Doctor identified a stable diagnostic condition affecting <component>."
command.doctor.finding.general.remediation: "Next: use the diagnostic code and affected path with the troubleshooting guide, correct the condition, and rerun Doctor."
