# MaddPrestige V2 Phase 4 generic lifecycle defaults.
# Stable IDs are independent of every display label.
schema-version: 4

prestige:
  enabled: false
  required-stages: []
  reset-stage: disabled
  current-count-increment: 1
  lifetime-count-increment: 1
  maximum: unlimited
  cooldown: PT0S
  costs: []
  rewards: []
  external-resets:
    enabled: false
  reset-policy:
    progression-stage: RESET
    active-requirement-progress: RESET
    latched-completions: RESET
    baselines: RESET
    prestige-scoped-currency: RESET
    purchased-perks: PRESERVE
    milestone-history: PRESERVE
    season-progress: PRESERVE
    historical-statistics: PRESERVE

currencies: {}
entitlements: {}
milestones: {}
seasons: {}

# The generic competition engine is intentionally deferred; this boundary must remain false.
competition:
  enabled: false
