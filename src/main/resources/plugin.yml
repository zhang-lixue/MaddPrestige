name: MaddPrestige
version: '${project.version}'
main: net.maddkraft.maddprestige.platform.paper.bootstrap.MaddPrestigeV2Plugin
description: Generic, provider-driven MaddPrestige V2 progression platform.
author: MaddKraft
api-version: '26.1.2'
load: POSTWORLD
softdepend:
  - Chunky
  - Citizens
  - ClickVillagers
  - CoreProtect
  - DiscordSRV
  - DriveBackupV2
  - EssentialsSpawn
  - EzATN
  - FancyHolograms
  - GrimAC
  - InventoryRollbackPlus
  - LiteBans
  - MaxCrates
  - MiniMOTD
  - Multiverse-NetherPortals
  - Multiverse-Portals
  - PlayTimeManager
  - PurpurExtras
  - SilkSpawners_v2
  - TreeFeller
  - Veinminer
  - voicechat
  - WorldEdit
  - WorldGuard
  - CraftEngine
  - LuckPerms
  - Vault
  - mcMMO
  - PlaceholderAPI
  - EconomyShopGUI
  - QuickShop-Hikari
  - GriefPrevention
  - UltimateMobCoins
  - Multiverse-Core
  - Multiverse-Inventories
  - TAB
  - Plan
  - Maintenance
  - Tebex
  - Essentials
  - EssentialsX
  - CMI
  - PlayerAuctions
  - AuctionHouse
  - ExcellentCrates
  - CrazyCrates
  - Nexo
  - ItemsAdder
  - Oraxen
commands:
  prestige:
    description: Open the MaddPrestige Player GUI.
    usage: /prestige
  maddprestige:
    aliases: [mprestige, mp]
    description: MaddPrestige V2 advanced commands and canonical administration surface.
    usage: /maddprestige [help|status|prestige|confirm|simulate|why|player|gui|admin|config|setup|doctor|locale|staff]
permissions:
  maddprestige.use:
    default: true
  maddprestige.rankup:
    default: true
  maddprestige.prestige:
    default: true
  maddprestige.admin:
    default: op
    children:
      maddprestige.admin.doctor: true
      maddprestige.admin.simulate: true
      maddprestige.admin.players.view: true
      maddprestige.admin.players.prestige: true
      maddprestige.admin.config.view: true
      maddprestige.admin.config.edit: true
      maddprestige.admin.config.apply: true
      maddprestige.admin.config.rollback: true
      maddprestige.admin.setup: true
      maddprestige.admin.gui: true
      maddprestige.admin.execute: true
      maddprestige.admin.locale.reload: true
  maddprestige.admin.doctor:
    default: op
  maddprestige.admin.simulate:
    default: op
  maddprestige.admin.players.view:
    default: op
  maddprestige.admin.players.prestige:
    default: op
  maddprestige.admin.config.view:
    default: op
  maddprestige.admin.config.edit:
    default: op
  maddprestige.admin.config.apply:
    default: op
  maddprestige.admin.config.rollback:
    default: op
  maddprestige.admin.setup:
    default: op
  maddprestige.admin.gui:
    default: op
  maddprestige.admin.execute:
    default: op
  maddprestige.admin.locale.reload:
    default: op
