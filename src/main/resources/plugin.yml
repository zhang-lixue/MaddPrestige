name: MaddPrestige
version: '${project.version}'
main: net.maddkraft.maddprestige.platform.paper.bootstrap.MaddPrestigeV2Plugin
description: Generic, provider-driven MaddPrestige V2 progression platform.
author: MaddKraft
api-version: '26.1.2'
load: POSTWORLD
softdepend:
  - Chunky
  - Citizens
  - ClickVillagers
  - CoreProtect
  - DiscordSRV
  - DriveBackupV2
  - EssentialsSpawn
  - EzATN
  - FancyHolograms
  - GrimAC
  - InventoryRollbackPlus
  - LiteBans
  - MaxCrates
  - MiniMOTD
  - Multiverse-NetherPortals
  - Multiverse-Portals
  - PlayTimeManager
  - PurpurExtras
  - SilkSpawners_v2
  - TreeFeller
  - Veinminer
  - voicechat
  - WorldEdit
  - WorldGuard
  - CraftEngine
  - LuckPerms
  - Vault
  - mcMMO
  - PlaceholderAPI
  - EconomyShopGUI
  - QuickShop-Hikari
  - GriefPrevention
  - UltimateMobCoins
  - Multiverse-Core
  - Multiverse-Inventories
  - TAB
  - Plan
  - Maintenance
  - Tebex
  - Essentials
  - EssentialsX
  - CMI
  - PlayerAuctions
  - AuctionHouse
  - ExcellentCrates
  - CrazyCrates
  - Nexo
  - ItemsAdder
  - Oraxen
commands:
  maddprestige:
    aliases: [mprestige, mp]
    description: MaddPrestige V2 status, diagnostics, providers, and configuration-authority guidance.
    usage: /maddprestige [status|doctor|providers|reload]
permissions:
  maddprestige.admin:
    default: op
    children:
      maddprestige.admin.config.apply: true
  maddprestige.admin.config.apply:
    default: op
