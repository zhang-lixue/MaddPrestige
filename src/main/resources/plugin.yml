name: MaddPrestige
version: '${project.version}'
main: gg.maddkraft.prestige.MaddPrestigePlugin
description: Player prestige, New Chapters, Legacy Stars, and The MaddHatter for MaddKraft.
author: MaddKraft
api-version: '26.1.2'
load: POSTWORLD
softdepend:
  - Chunky
  - Citizens
  - ClickVillagers
  - CoreProtect
  - DiscordSRV
  - DriveBackupV2
  - EssentialsSpawn
  - EzATN
  - FancyHolograms
  - GrimAC
  - InventoryRollbackPlus
  - LiteBans
  - MaxCrates
  - MiniMOTD
  - Multiverse-NetherPortals
  - Multiverse-Portals
  - PlayTimeManager
  - PurpurExtras
  - SilkSpawners_v2
  - TreeFeller
  - Veinminer
  - voicechat
  - WorldEdit
  - WorldGuard
  - LuckPerms
  - Vault
  - mcMMO
  - PlaceholderAPI
  - EconomyShopGUI
  - QuickShop-Hikari
  - GriefPrevention
  - UltimateMobCoins
  - Multiverse-Core
  - Multiverse-Inventories
  - TAB
  - Plan
  - Maintenance
  - Tebex
  - Essentials
  - EssentialsX
  - CMI
  - PlayerAuctions
  - AuctionHouse
  - ExcellentCrates
  - CrazyCrates
  - Nexo
  - ItemsAdder
  - Oraxen
commands:
  rankup:
    description: View or advance MaddKraft's free progression ladder.
    usage: /rankup [confirm]
    permission: maddprestige.rankup
  prestige:
    description: View prestige progress and prestige rewards.
    usage: /prestige [menu|settings|confirm|rewards|buy|top|history]
    permission: maddprestige.prestige
  season:
    description: View the current New Chapter.
    usage: /season [status]
    permission: maddprestige.season
  maddhatter:
    description: View The MaddHatter and Hatter's Contest.
    usage: /maddhatter [top|history|claim]
    permission: maddprestige.maddhatter
  maddprestige:
    aliases: [mprestige, mp]
    description: MaddPrestige administrative command.
    usage: /maddprestige [gui|help]
    permission: maddprestige.admin
permissions:
  maddprestige.rankup:
    default: true
  maddprestige.prestige:
    default: true
  maddprestige.season:
    default: true
  maddprestige.maddhatter:
    default: true
  maddprestige.admin:
    default: op
    children:
      maddprestige.admin.gui: true
  maddprestige.admin.reload:
    default: op
  maddprestige.admin.inspect:
    default: op
  maddprestige.admin.modify:
    default: op
  maddprestige.admin.season:
    default: op
  maddprestige.admin.hatter:
    default: op
  maddprestige.admin.patron:
    default: op
  maddprestige.admin.gui:
    description: Opens and uses the in-game staff control panel.
    default: op
  maddprestige.staff:
    description: Excludes staff from MaddHatter contest scoring.
    default: op
